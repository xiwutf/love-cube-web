server:
  address: 0.0.0.0
  port: 8090
  servlet:
    context-path: /admin

# 密钥与数据库账号一律走环境变量，不要写进仓库。
# 本地启动至少需要：SPRING_DATASOURCE_URL、SPRING_DATASOURCE_USERNAME、SPRING_DATASOURCE_PASSWORD
# 生产额外需要：SPRING_PROFILES_ACTIVE=prod、JWT_SECRET

jwt:
  # 生产必须用 JWT_SECRET 覆盖；默认值仅供本地开发，勿当生产密钥
  secret: ${JWT_SECRET:local-dev-only-insecure-jwt-secret-do-not-use-in-prod}
  expiration: 864000000  # 10 days in milliseconds

app:
  base-url: ${APP_BASE_URL:}
  avatar-path: /uploads/avatar/
  photos-path: /uploads/photos/
  oss:
    enabled: ${OSS_ENABLED:false}
    access-key-id: ${OSS_ACCESS_KEY_ID:}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
    endpoint: ${OSS_ENDPOINT:oss-cn-beijing.aliyuncs.com}
    bucket-name: ${OSS_BUCKET_NAME:love-cube-files}
    cdn-domain: ${OSS_CDN_DOMAIN:}
    avatar-folder: ${OSS_AVATAR_FOLDER:avatars/}
    photos-folder: ${OSS_PHOTOS_FOLDER:photos/}
    verify-folder: ${OSS_VERIFY_FOLDER:verify/}

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 120MB
    
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/lovecube?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:root}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1

  sql:
    init:
      mode: never

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 13
    validate-on-migrate: true
    # 由 FlywayRepairMigrationStrategyConfig 读取：先 repair 再 migrate。checksum 对齐后请改 false
    repair-on-migrate: true

  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 10000
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1

  session:
    store-type: none  # 暂时禁用 Redis session 存储

  cache:
    type: none  # 暂时禁用 Redis 缓存

  mail:
    host: ${MAIL_HOST:smtp.example.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          starttls:
            enable: false

logging:
  level:
    root: warn
    com.lovecube: info
    org.springframework.web: warn
  file:
    name: logs/love-cube.log
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n"

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

wechat:
  appid: ${WECHAT_APPID:}
  secret: ${WECHAT_SECRET:}
  api:
    login:
      path: /api/wechat/login

lovecube:
  notification:
    mail:
      enabled: ${NOTIFICATION_MAIL_ENABLED:false}
      from-name: Love Cube
    pushplus:
      url: https://www.pushplus.plus/send
  admin:
    # 工作台 /api/admin/stats 聚合结果内存缓存秒数；0 表示不缓存（多实例各自 JVM 内生效）
    dashboard-stats-cache-seconds: 45
  fellowship:
    # 暂关 VIP 付费能力时，喜欢/访客名单不对非 VIP 用户隐藏
    vip-commerce-enabled: false
    growth-backfill:
      # 设为 true 时应用启动后自动执行一次历史用户成长/徽章补偿
      on-startup: false
