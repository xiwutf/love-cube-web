name: Deploy LoveCube Backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-backend-main
  cancel-in-progress: true

jobs:
  deploy-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Ensure mvnw executable
        run: chmod +x backend/mvnw

      - name: Build backend jar
        working-directory: backend
        run: ./mvnw -DskipTests package

      - name: Prepare remote staging directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: 22
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            mkdir -p /tmp/lovecube-api-release /tmp/lovecube-deploy /opt/lovecube-api/backup
            rm -rf /tmp/lovecube-api-release/*
            rm -rf /tmp/lovecube-deploy/*

      - name: Upload jar to staging
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: 22
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "backend/target/*.jar"
          target: "/tmp/lovecube-api-release"
          strip_components: 2
          overwrite: true

      - name: Upload deploy scripts
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: 22
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "deploy/deploy.sh,deploy/health-check.sh"
          target: "/tmp/lovecube-deploy"
          strip_components: 1
          overwrite: true

      - name: Publish backend via deploy.sh
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: 22
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            sed -i 's/\r$//' /tmp/lovecube-deploy/*.sh
            chmod +x /tmp/lovecube-deploy/*.sh
            bash /tmp/lovecube-deploy/deploy.sh backend /tmp/lovecube-api-release
