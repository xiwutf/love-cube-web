name: Deploy LoveCube Frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-frontend-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint styles
        working-directory: frontend
        run: npm run lint:style

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Prepare remote staging directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: 22
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            mkdir -p /tmp/lovecube-web-release /tmp/lovecube-deploy
            rm -rf /tmp/lovecube-web-release/*
            rm -rf /tmp/lovecube-deploy/*

      - name: Upload dist to staging
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: 22
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "frontend/dist/**"
          target: "/tmp/lovecube-web-release"
          strip_components: 2
          overwrite: true

      - name: Upload deploy scripts
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: 22
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "deploy/deploy.sh,deploy/health-check.sh"
          target: "/tmp/lovecube-deploy"
          strip_components: 1
          overwrite: true

      - name: Publish frontend via deploy.sh
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: 22
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            sed -i 's/\r$//' /tmp/lovecube-deploy/*.sh
            chmod +x /tmp/lovecube-deploy/*.sh
            bash /tmp/lovecube-deploy/deploy.sh frontend /tmp/lovecube-web-release
