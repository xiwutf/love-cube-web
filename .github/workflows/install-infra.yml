name: Install LoveCube Infra

on:
  workflow_dispatch:
    inputs:
      install_systemd:
        description: 安装或更新 lovecube-api systemd service（不停迁目录）
        type: boolean
        default: true
      write_env_file:
        description: 用 GitHub Secrets 写入 /opt/lovecube-api/lovecube-api.env
        type: boolean
        default: true
      apply_nginx:
        description: 安装/更新 nginx 站点配置并 reload（默认关闭）
        type: boolean
        default: false

concurrency:
  group: install-infra
  cancel-in-progress: false

jobs:
  install-infra:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare remote directories
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: 22
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            mkdir -p /tmp/lovecube-deploy /tmp/lovecube-nginx /opt/lovecube-api
            rm -rf /tmp/lovecube-deploy/*
            rm -rf /tmp/lovecube-nginx/*

      - name: Upload deploy assets
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: 22
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "deploy/*"
          target: "/tmp/lovecube-deploy"
          strip_components: 1
          overwrite: true

      - name: Upload nginx config to temp
        if: ${{ inputs.apply_nginx }}
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: 22
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "frontend/nginx.conf"
          target: "/tmp/lovecube-nginx"
          strip_components: 1
          overwrite: true

      - name: Write env file and install systemd
        uses: appleboy/ssh-action@v1.0.3
        env:
          SPRING_PROFILES_ACTIVE: ${{ secrets.SPRING_PROFILES_ACTIVE }}
          SPRING_DATASOURCE_URL: ${{ secrets.SPRING_DATASOURCE_URL }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          WECHAT_APPID: ${{ secrets.WECHAT_APPID }}
          WECHAT_SECRET: ${{ secrets.WECHAT_SECRET }}
          OSS_ENABLED: ${{ secrets.OSS_ENABLED }}
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
          OSS_BUCKET_NAME: ${{ secrets.OSS_BUCKET_NAME }}
          OSS_CDN_DOMAIN: ${{ secrets.OSS_CDN_DOMAIN }}
          MAIL_HOST: ${{ secrets.MAIL_HOST }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          NOTIFICATION_MAIL_ENABLED: ${{ secrets.NOTIFICATION_MAIL_ENABLED }}
          WRITE_ENV_FILE: ${{ inputs.write_env_file }}
          INSTALL_SYSTEMD: ${{ inputs.install_systemd }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: 22
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: SPRING_PROFILES_ACTIVE,SPRING_DATASOURCE_URL,SPRING_DATASOURCE_USERNAME,SPRING_DATASOURCE_PASSWORD,JWT_SECRET,APP_BASE_URL,WECHAT_APPID,WECHAT_SECRET,OSS_ENABLED,OSS_ACCESS_KEY_ID,OSS_ACCESS_KEY_SECRET,OSS_ENDPOINT,OSS_BUCKET_NAME,OSS_CDN_DOMAIN,MAIL_HOST,MAIL_PORT,MAIL_USERNAME,MAIL_PASSWORD,NOTIFICATION_MAIL_ENABLED,WRITE_ENV_FILE,INSTALL_SYSTEMD
          script: |
            set -euo pipefail
            sed -i 's/\r$//' /tmp/lovecube-deploy/* || true
            chmod +x /tmp/lovecube-deploy/*.sh

            if [ "${WRITE_ENV_FILE}" = "true" ]; then
              bash /tmp/lovecube-deploy/write-env.sh /opt/lovecube-api/lovecube-api.env
            else
              echo "[infra] skip writing env file"
            fi

            if [ "${INSTALL_SYSTEMD}" = "true" ]; then
              bash /tmp/lovecube-deploy/install-service.sh
            else
              echo "[infra] skip systemd install"
            fi

      - name: Apply nginx config
        if: ${{ inputs.apply_nginx }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: 22
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            if [ ! -f /tmp/lovecube-nginx/nginx.conf ]; then
              echo "[infra] ERROR: /tmp/lovecube-nginx/nginx.conf missing"
              exit 1
            fi
            if [ -f /etc/nginx/sites-available/lovecube ]; then
              sudo cp /etc/nginx/sites-available/lovecube "/etc/nginx/sites-available/lovecube.bak.$(date +%Y%m%d-%H%M%S)"
            fi
            sudo cp /tmp/lovecube-nginx/nginx.conf /etc/nginx/sites-available/lovecube
            sudo ln -sf /etc/nginx/sites-available/lovecube /etc/nginx/sites-enabled/lovecube
            sudo nginx -t
            sudo systemctl reload nginx
            echo "[infra] nginx reloaded"
